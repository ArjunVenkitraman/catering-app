services:
  - type: web
    name: catering-planner-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker -w 2 -b 0.0.0.0:$PORT --timeout 120 app.main:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: CATERING_DEBUG
        value: "false"
      - key: CATERING_DATABASE_URL
        sync: false
      - key: CATERING_CORS_ORIGINS
        sync: false
      - key: CATERING_CORS_ALLOW_CREDENTIALS
        value: "false"
      - key: CATERING_HEALTHCHECK_DB
        value: "true"
    preDeployCommand: alembic upgrade head
